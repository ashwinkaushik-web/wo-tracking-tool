name: No-WO Slack post

# Posts the PO-level "no work order" list to #merchandise-planning-europe
# on Mondays and Wednesdays. Cron is UTC; "0 6 * * 1,3" ≈ 06:00–07:00 UK
# (07:00 BST in summer, 06:00 GMT in winter). Adjust the hour if you want a
# different time. You can also run it on demand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1,3"   # Mon & Wed, 06:00 UTC
  workflow_dispatch: {}      # manual "Run workflow" button for testing

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install snowflake-connector-python cryptography

      - name: Post no-WO list to Slack
        env:
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: python scripts/post_no_wo_to_slack.py
